# À INSTALLER SUR LE SERVEUR 5.196.101.123 (par son administrateur), en remplacement des
# redirections 301 actuelles vers http://51.255.161.55:<port> des 6 sous-domaines ci-dessous.
#
# Pré-requis : copier le certificat public fourni par SageAgent dans /etc/nginx/ssl/itbord-backend.crt
# (aucune clé privée n'est fournie, ni nécessaire).
# Remplacer les 2 chemins ssl_certificate* par ceux du certificat *.ittelecom.ma déjà en place.
# Puis : sudo nginx -t && sudo systemctl reload nginx
# Retour arrière : remettre les anciens blocs 301 et recharger nginx.

server {
    listen 80;
    server_name health.ittelecom.ma rousseau.ittelecom.ma cross.ittelecom.ma
                muliparts.ittelecom.ma muliteq.ittelecom.ma mms.ittelecom.ma;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;              # nginx < 1.25 : supprimer cette ligne et écrire « listen 443 ssl http2; »
    server_name health.ittelecom.ma rousseau.ittelecom.ma cross.ittelecom.ma
                muliparts.ittelecom.ma muliteq.ittelecom.ma mms.ittelecom.ma;

    ssl_certificate     /CHEMIN/EXISTANT/ittelecom.ma/fullchain.pem;
    ssl_certificate_key /CHEMIN/EXISTANT/ittelecom.ma/privkey.pem;

    location / {
        proxy_pass https://51.255.161.55;

        # Vérifie que le serveur joint est bien celui de SageAgent (certificat fourni)
        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/ssl/itbord-backend.crt;
        proxy_ssl_server_name         on;
        proxy_ssl_name                $host;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 300;
        client_max_body_size 20m;
    }
}
