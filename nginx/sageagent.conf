# Reverse proxy SAGEIA - un sous-domaine par client -> instance Streamlit dédiée.
# Installation :
#   sudo cp nginx/sageagent.conf /etc/nginx/sites-available/sageagent.conf
#   sudo ln -s /etc/nginx/sites-available/sageagent.conf /etc/nginx/sites-enabled/sageagent.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domaine de test (phase 1) : sageagent.test. Bascule finale (phase 2) : remplacer
# sageagent.test par le vrai domaine ci-dessous, et les 2 lignes ssl_certificate*
# par les chemins du certificat Let's Encrypt (voir docs/nginx/2st_implementation).

# Redirection HTTP -> HTTPS pour tous les sous-domaines clients
server {
    listen 80;
    server_name ~^(?<sub>.+)\.sageagent\.test$;
    return 301 https://$host$request_uri;
}

# Un seul bloc HTTPS générique pour tous les clients (grâce à la map + un cert couvrant tous les sous-domaines)
server {
    listen 443 ssl;
    server_name ~^(?<sub>.+)\.sageagent\.test$;

    ssl_certificate     /etc/nginx/ssl/sageagent-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/sageagent-selfsigned.key;

    # Sous-domaine inconnu (absent de la map) -> 404, pas de fuite vers un port par défaut
    if ($sageagent_port = 0) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:$sageagent_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # WebSocket Streamlit longue durée
    }
}
