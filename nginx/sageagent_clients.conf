# Table de routage : sous-domaine client -> port local de son instance Streamlit dédiée.
# Installation : sudo cp nginx/sageagent_clients.conf /etc/nginx/conf.d/sageagent_clients.conf
#
# IMPORTANT : ce fichier doit avoir l'extension .conf (pas .map) pour être chargé, car
# /etc/nginx/nginx.conf ne fait que `include /etc/nginx/conf.d/*.conf;` — un nom en .map
# est silencieusement ignoré (c'est l'erreur "unknown \"sageagent_port\" variable" rencontrée
# lors de la 1ère installation).
#
# Domaine de test (phase 1) : sageagent.test (résolu via /etc/hosts, voir docs/nginx/1st_implementation)
# Bascule finale (phase 2)  : remplacer sageagent.test par le vrai domaine (voir docs/nginx/2st_implementation)
map $host $sageagent_port {
    default                     0;
    cross.sageagent.test        8506;
    rousseau.sageagent.test     8507;
    mms.sageagent.test          8508;
    muliparts.sageagent.test    8509;
    client_01.sageagent.test    8510;
    # ajouter une ligne par nouveau client ici (voir docs/nginx/2st_implementation)
}
