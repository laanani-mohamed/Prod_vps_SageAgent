# Front ITBORD (Next.js, 127.0.0.1:8504) sur https://itbord.ma — DNS chez Heberjahiz → 51.255.161.55.
# Certificat Let's Encrypt obtenu AVANT d'installer ce fichier :
#   sudo certbot certonly --nginx -d itbord.ma -d www.itbord.ma -m <email> --agree-tos --no-eff-email
# Installation :
#   sudo cp /opt/SageAgent/nginx/itbord_ma.conf /etc/nginx/sites-available/itbord_ma.conf
#   sudo ln -sf /etc/nginx/sites-available/itbord_ma.conf /etc/nginx/sites-enabled/itbord_ma.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Renouvellement : automatique (timer certbot), test : sudo certbot renew --dry-run

# HTTP → HTTPS (certbot passe aussi par ce port 80 pour renouveler)
server {
    listen 80;
    server_name itbord.ma www.itbord.ma;
    return 301 https://itbord.ma$request_uri;
}

# www → domaine nu
server {
    listen 443 ssl;
    server_name www.itbord.ma;
    ssl_certificate     /etc/letsencrypt/live/itbord.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itbord.ma/privkey.pem;
    return 301 https://itbord.ma$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name itbord.ma;

    ssl_certificate     /etc/letsencrypt/live/itbord.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itbord.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Next.js compare Origin et Host (Server Actions : login)
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;   # cookies de session marqués Secure (lib/session.ts, estHttps)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;                      # exports PDF / Excel longs
        client_max_body_size 20m;
    }
}
