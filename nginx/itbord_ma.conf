# Front ITBORD (Next.js, 127.0.0.1:8504) sur https://itbord.ma et https://<client>.itbord.ma.
# DNS : zone itbord.ma chez Cloudflare (DNS only), « @ », « www » et « * » → 51.255.161.55.
# Certificat Let's Encrypt wildcard (validation DNS-01 par l'API Cloudflare), obtenu AVANT d'installer ce fichier :
#   sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#        --dns-cloudflare-propagation-seconds 30 --cert-name itbord.ma -d itbord.ma -d '*.itbord.ma' \
#        --deploy-hook "systemctl reload nginx"
# Installation :
#   sudo cp /opt/SageAgent/nginx/itbord_ma.conf /etc/nginx/sites-available/itbord_ma.conf
#   sudo ln -sf /etc/nginx/sites-available/itbord_ma.conf /etc/nginx/sites-enabled/itbord_ma.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Renouvellement : automatique (timer certbot), test : sudo certbot renew --dry-run
# Le sous-domaine est transmis au front dans Host : c'est lui qui choisit le logo du client.

# Nom inconnu (IP nue, domaine non prévu) en HTTPS : poignée de main TLS refusée,
# au lieu de tomber sur le premier bloc 443 avec un certificat qui ne correspond pas.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# HTTP → HTTPS (le renouvellement passe par le DNS, plus par ce port 80)
server {
    listen 80;
    server_name itbord.ma *.itbord.ma;
    return 301 https://$host$request_uri;
}

# www → domaine nu
server {
    listen 443 ssl;
    server_name www.itbord.ma;
    ssl_certificate     /etc/letsencrypt/live/itbord.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itbord.ma/privkey.pem;
    return 301 https://itbord.ma$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name itbord.ma *.itbord.ma;   # www a son bloc dédié ci-dessus (nom exact prioritaire sur *.)

    ssl_certificate     /etc/letsencrypt/live/itbord.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itbord.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Next.js compare Origin et Host (Server Actions : login)
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;   # cookies de session marqués Secure (lib/session.ts, estHttps)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;                      # exports PDF / Excel longs
        client_max_body_size 20m;
    }

    # Page « Dépôt des fichiers » : exports Sage jusqu'à 2 Go (F_DOCLIGNE de CROSS : 173 Mo),
    # transmis en flux au front puis à l'API (api/depot/router.py), sans copie temporaire par nginx.
    location /depot/api/fichiers/ {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;
        client_max_body_size 2g;
        proxy_request_buffering off;
    }

    # Dashboard Ops (Streamlit interne, 127.0.0.1:8585) sur https://itbord.ma/tech/ : il est lancé avec
    # --server.baseUrlPath tech, le chemin /tech/… lui est donc transmis tel quel. Accès protégé par son mot de passe.
    location = /tech { return 301 /tech/; }
    location /tech/ {
        proxy_pass http://127.0.0.1:8585;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Streamlit accepte le WebSocket si Origin = Host
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;   # Streamlit échange par WebSocket
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400;                    # session WebSocket ouverte toute la journée
        client_max_body_size 20m;
    }
}
