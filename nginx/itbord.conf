# Front ITBORD (Next.js, 127.0.0.1:8504) derrière le reverse proxy de 5.196.101.123.
# Le navigateur parle à 5.196 (certificat Let's Encrypt *.ittelecom.ma) ; 5.196 nous relaie en HTTPS
# et vérifie notre certificat auto-signé (itbord-backend.crt, qu'on lui a fourni).
# Installation : voir docs/nginx/3rd_implementation/README.md
#
# Un seul front pour tous les clients : le client et le profil viennent du jeton de connexion,
# pas du sous-domaine. Nouveau sous-domaine → l'ajouter ici ET dans ittelecom_proxy_5196.conf.

server {
    listen 443 ssl;
    server_name health.ittelecom.ma rousseau.ittelecom.ma cross.ittelecom.ma
                muliparts.ittelecom.ma muliteq.ittelecom.ma mms.ittelecom.ma;

    ssl_certificate     /etc/nginx/ssl/itbord-backend.crt;
    ssl_certificate_key /etc/nginx/ssl/itbord-backend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Seul le proxy de 5.196 entre (127.0.0.1 : nos tests depuis le serveur)
    allow 5.196.101.123;
    allow 127.0.0.1;
    deny  all;

    # IP réelle du visiteur (logs nginx, audit de l'API) au lieu de celle de 5.196
    set_real_ip_from 5.196.101.123;
    real_ip_header   X-Forwarded-For;

    location / {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Next.js compare Origin et Host (Server Actions : login)
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;   # cookies de session marqués Secure (lib/session.ts, estHttps)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;                      # exports PDF / Excel longs
        client_max_body_size 20m;
    }
}
